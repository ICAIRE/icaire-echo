<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ICAIRE Echo</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b1e27; color: #edf3f2; font: 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
    main { height: 100%; display: grid; place-items: center; text-align: center; }
    .bars { display: flex; gap: 6px; align-items: center; justify-content: center; height: 48px; margin-bottom: 18px; }
    .bars i { width: 6px; border-radius: 3px; background: #8dc63f; animation: b 1.1s ease-in-out infinite; }
    .bars i:nth-child(1) { height: 14px; animation-delay: 0s; }
    .bars i:nth-child(2) { height: 30px; animation-delay: .12s; }
    .bars i:nth-child(3) { height: 46px; animation-delay: .24s; }
    .bars i:nth-child(4) { height: 26px; animation-delay: .36s; opacity: .7; }
    .bars i:nth-child(5) { height: 14px; animation-delay: .48s; opacity: .45; }
    @keyframes b { 50% { transform: scaleY(.45); } }
    h1 { font-size: 20px; font-weight: 400; margin: 0 0 6px; }
    h1 b { font-weight: 650; }
    p { color: #9db4bd; margin: 0; max-width: 460px; }
    #err { color: #f0a3a6; margin-top: 14px; }
    @media (prefers-reduced-motion: reduce) { .bars i { animation: none; } }
  </style>
</head>
<body>
  <main>
    <div>
      <div class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <h1>ICAIRE <b>Echo</b></h1>
      <p id="msg">Starting…</p>
      <p id="err" hidden></p>
    </div>
  </main>
  <script>
    window.showError = function (text) {
      document.getElementById('msg').hidden = true;
      var e = document.getElementById('err');
      e.textContent = text;
      e.hidden = false;
    };
  </script>
</body>
</html>
