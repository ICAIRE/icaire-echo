# Builds the ICAIRE Echo desktop app (Tauri) for Mac and Windows on clean machines, installs each one there and
# checks that it starts, runs the app inside it, finds its own transcriber and quits; Windows also uninstalls.
# For a tag v<version> it then publishes both installers as a GitHub release.
# Run by hand (Actions › release › Run workflow) to only build and test.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: npm ci --no-audit --no-fund
      - name: Build the app and the disk image
        run: bash packaging/mac/build.sh
      - name: Install from the disk image, start it, check it, quit it
        run: |
          DMG=$(ls dist/ICAIRE-Echo-*-mac.dmg)
          echo "disk image: $DMG ($(stat -f%z "$DMG") bytes)"
          MNT=$(hdiutil attach -nobrowse -noautoopen "$DMG" | grep -o '/Volumes/.*' | tail -1)
          ditto "$MNT/ICAIRE Echo.app" "/Applications/ICAIRE Echo.app"
          hdiutil detach -quiet "$MNT"
          BIN=$(ls "/Applications/ICAIRE Echo.app/Contents/MacOS/" | head -1)
          MRB_NO_AUTO_UPDATE=1 "/Applications/ICAIRE Echo.app/Contents/MacOS/$BIN" &
          APP_PID=$!
          for i in $(seq 1 90); do curl -fs -o /dev/null http://localhost:4777/api/state && break; sleep 1; done
          curl -fs http://localhost:4777/api/whisper | tee whisper.json
          node -e "const w=require('./whisper.json'); if (!/ICAIRE Echo\.app\/Contents\/Resources\/stage\/app\/bin\/whisper-cli$/.test(w.engine||'')) { console.error('the transcriber inside the app was not found'); process.exit(1) }"
          test -d "$HOME/Library/Application Support/ICAIRE Echo"
          curl -fs -X POST -H 'x-mrb: 1' -H 'content-type: application/json' -d '{}' http://localhost:4777/api/quit
          for i in $(seq 1 20); do kill -0 $APP_PID 2>/dev/null || break; sleep 0.5; done
          if kill -0 $APP_PID 2>/dev/null; then echo "the app did not quit"; exit 1; fi
          cat "$HOME/Library/Logs/ICAIRE Echo/echo.log"
      - uses: actions/upload-artifact@v4
        with:
          name: icaire-echo-mac
          path: dist/ICAIRE-Echo-*-mac.dmg

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: npm ci --no-audit --no-fund
      - name: Build the installer
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - name: Install it, start it, check it, quit it, uninstall it
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dist\ICAIRE-Echo-*-windows-setup.exe).FullName
          Write-Host "installer: $exe ($((Get-Item $exe).Length) bytes)"
          Start-Process $exe -ArgumentList '/S' -Wait
          $app = "$env:LOCALAPPDATA\ICAIRE Echo"
          $main = Get-ChildItem $app -Filter '*.exe' | Where-Object { $_.Name -notlike 'uninstall*' } | Select-Object -First 1
          if (-not $main) { throw "not installed in $app" }
          # screen video (desktop/src/video.rs): 10 s with a 2 s pause, through the app's own ffmpeg; about 8 s of video
          $ff = Get-ChildItem "$app\stage" -Recurse -Filter 'ffmpeg.exe' | Select-Object -First 1
          if (-not $ff) { throw 'ffmpeg was not found inside the app' }
          $vt = Join-Path $env:RUNNER_TEMP 'video-test'
          # Start-Process joins its arguments with spaces and does not quote them: the paths (ICAIRE Echo) are quoted here
          $err = Join-Path $env:RUNNER_TEMP 'video-test.err'
          $v = Start-Process $main.FullName -ArgumentList '--video-test', "`"$vt`"", "`"$($ff.FullName)`"", '10' -Wait -PassThru -RedirectStandardError $err
          if ($v.ExitCode -ne 0) { Get-Content $err -ErrorAction SilentlyContinue; throw "the screen video test failed ($($v.ExitCode))" }
          $probe = & $ff.FullName -hide_banner -i (Join-Path $vt 'screen.mp4') 2>&1 | Out-String
          Write-Host $probe
          if ($probe -notmatch 'Duration: 00:00:0([7-9])') { throw 'the screen video is not about 8 s long' }
          $env:MRB_NO_AUTO_UPDATE = '1'
          $p = Start-Process $main.FullName -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90 -and -not $ok; $i++) { try { Invoke-WebRequest -UseBasicParsing http://localhost:4777/api/state | Out-Null; $ok = $true } catch { Start-Sleep 1 } }
          if (-not $ok) { Get-Content "$env:APPDATA\ICAIRE Echo\logs\echo.log" -ErrorAction SilentlyContinue; throw 'the app did not start' }
          $w = Invoke-RestMethod http://localhost:4777/api/whisper
          Write-Host "transcriber: $($w.engine)"
          if ($w.engine -notlike "*\stage\app\bin\*whisper-cli.exe") { throw 'the transcriber inside the app was not found' }
          Invoke-WebRequest -UseBasicParsing -Method Post -Headers @{ 'x-mrb' = '1' } -ContentType 'application/json' -Body '{}' http://localhost:4777/api/quit | Out-Null
          for ($i = 0; $i -lt 20 -and -not $p.HasExited; $i++) { Start-Sleep -Milliseconds 500 }
          if (-not $p.HasExited) { throw 'the app did not quit' }
          Start-Process "$app\uninstall.exe" -ArgumentList '/S' -Wait
          Start-Sleep 3
          if (Test-Path $main.FullName) { throw 'the uninstaller left the app behind' }
      - uses: actions/upload-artifact@v4
        with:
          name: icaire-echo-windows
          path: dist/ICAIRE-Echo-*-windows-setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/* --repo "${GITHUB_REPOSITORY}" --title "ICAIRE Echo ${GITHUB_REF_NAME#v}" \
            --notes "Download the installer for your computer: the .dmg for a Mac (Apple silicon), the setup .exe for Windows. See the README for the first launch."
